name: Publish

# Push a tag like v0.3.1 to publish that version to npm. Uses npm trusted
# publishing (OIDC), so there is no npm token in the repo secrets. Set it up once
# on npmjs.com: package settings, Trusted Publisher, GitHub Actions,
# repository Leon24k/caveman-indonesia, workflow publish.yml.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24  # trusted publishing needs npm 11.5.1 or newer
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json
        run: test "${GITHUB_REF_NAME}" = "v$(node -p 'require("./package.json").version')"
      - run: npm test
      - run: npm publish
